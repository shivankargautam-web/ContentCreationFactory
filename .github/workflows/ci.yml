name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acf
          POSTGRES_PASSWORD: acf
          POSTGRES_DB: acf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acf" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://acf:acf@localhost:5432/acf_test
      DATABASE_URL: postgresql+asyncpg://acf:acf@localhost:5432/acf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing
      - name: Migrations apply, match models, and roll back
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health/ready && break; sleep 4; done
          curl -fsS http://localhost:3000/login > /dev/null
      - if: always()
        run: docker compose logs --tail=200 && docker compose down -v
